<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>App Stability Monitor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>App Stability Monitor</h1>
    <p>Color-coded health by section with drilldowns and insights.</p>
  </header>

  <section id="summary">
    <div class="card" id="overall-pass">Overall pass rate: <span>--%</span></div>
    <div class="card" id="passed">Passed: <span>--</span></div>
    <div class="card" id="failed">Failed: <span>--</span></div>
    <div class="card" id="last-run">Last run: <span>--</span></div>
  </section>

  <section id="section-cards"></section>

  <section id="top-problems">
    <div class="column">
      <h2>Top Problem Sections</h2>
      <ul id="top-sections"></ul>
    </div>
    <div class="column">
      <h2>Top 5 Features with Problems</h2>
      <ul id="top-features"></ul>
    </div>
    <div class="column">
      <h2>Top 10 Failed Test Cases</h2>
      <ul id="top-failed"></ul>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
