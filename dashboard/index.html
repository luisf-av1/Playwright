<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Playwright Test Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body class="bg-gray-50 text-gray-900">
<div class="max-w-7xl mx-auto p-6">
  <h1 class="text-3xl font-bold mb-6">Playwright Test Dashboard</h1>

  <!-- Summary Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-8">
    <div class="bg-white shadow rounded-lg p-4 text-center">
      <p class="text-gray-500">Passed</p>
      <p id="passedCount" class="text-2xl font-bold">0</p>
    </div>
    <div class="bg-white shadow rounded-lg p-4 text-center">
      <p class="text-gray-500">Failed</p>
      <p id="failedCount" class="text-2xl font-bold text-red-500">0</p>
    </div>
    <div class="bg-white shadow rounded-lg p-4 text-center">
      <p class="text-gray-500">Pass Rate</p>
      <p id="passRate" class="text-2xl font-bold">0%</p>
    </div>
    <div class="bg-white shadow rounded-lg p-4 text-center">
      <p class="text-gray-500">Duration</p>
      <p id="duration" class="text-2xl font-bold">0s</p>
    </div>
  </div>

  <!-- Chart -->
  <div id="chart" class="bg-white p-4 shadow rounded-lg mb-8"></div>

  <!-- Table -->
  <div class="bg-white shadow rounded-lg p-4">
    <h2 class="text-xl font-bold mb-4">Top Unstable Sections</h2>
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-gray-100">
          <th class="p-2">#</th>
          <th class="p-2">Section</th>
          <th class="p-2">Pass Rate</th>
        </tr>
      </thead>
      <tbody id="unstableTable"></tbody>
    </table>
  </div>
</div>

<script>
async function loadReport() {
  const res = await fetch('./test-results.json');
  const data = await res.json();

  let passed = 0, failed = 0;
  const sectionStats = {};

  data.suites.forEach(suite => {
    suite.suites?.forEach(sub => {
      let secPassed = 0, secTotal = 0;
      sub.specs?.forEach(spec => {
        spec.tests.forEach(test => {
          const status = test.results[0].status;
          secTotal++;
          if (status === "passed") passed++, secPassed++;
          else failed++;
        });
      });
      sectionStats[sub.title] = {
        passed: secPassed,
        total: secTotal,
        passRate: secTotal ? (secPassed / secTotal) * 100 : 0
      };
    });
  });

  // Update cards
  const totalTests = passed + failed;
  document.getElementById("passedCount").innerText = passed;
  document.getElementById("failedCount").innerText = failed;
  document.getElementById("passRate").innerText = ((passed / totalTests) * 100).toFixed(1) + "%";
  document.getElementById("duration").innerText = (data.stats.duration / 1000).toFixed(1) + "s";

  // Chart
  const chartOptions = {
    chart: { type: 'bar', height: 300 },
    series: [{ name: 'Pass Rate', data: Object.values(sectionStats).map(s => s.passRate.toFixed(1)) }],
    xaxis: { categories: Object.keys(sectionStats) },
    colors: ['#16a34a']
  };
  new ApexCharts(document.querySelector("#chart"), chartOptions).render();

  // Table
  const sortedSections = Object.entries(sectionStats)
    .sort((a,b) => a[1].passRate - b[1].passRate)
    .slice(0,5);
  const tableBody = document.getElementById("unstableTable");
  sortedSections.forEach(([name, stats], i) => {
    const row = `<tr>
      <td class="p-2">${i+1}</td>
      <td class="p-2">${name}</td>
      <td class="p-2">${stats.passRate.toFixed(1)}%</td>
    </tr>`;
    tableBody.innerHTML += row;
  });
}

loadReport();
</script>
</body>
</html>
