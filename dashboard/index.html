<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>App Stability Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<style>
  .cursor-pointer { cursor: pointer; }
</style>
</head>
<body class="bg-gray-50 text-gray-900">
<div class="max-w-7xl mx-auto p-6">
  <h1 class="text-3xl font-bold mb-2">App Stability Dashboard</h1>
  <p class="mb-6">App stability based on test executions</p>

  <!-- Summary Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-5 gap-4 mb-8">
    <div class="bg-white shadow rounded-lg p-4 text-center">
      <p class="text-gray-500">Passed</p>
      <p id="passedCount" class="text-2xl font-bold">0</p>
    </div>
    <div class="bg-white shadow rounded-lg p-4 text-center">
      <p class="text-gray-500">Failed</p>
      <p id="failedCount" class="text-2xl font-bold text-red-500">0</p>
    </div>
    <div class="bg-white shadow rounded-lg p-4 text-center">
      <p class="text-gray-500">Overall Pass Rate</p>
      <p id="passRate" class="text-2xl font-bold">0%</p>
    </div>
    <div class="bg-white shadow rounded-lg p-4 text-center">
      <p class="text-gray-500">Last Execution Date</p>
      <p id="date" class="text-sm font-bold">-</p>
    </div>
    <div class="bg-white shadow rounded-lg p-4 text-center">
      <p class="text-gray-500">Execution Duration</p>
      <p id="duration" class="text-2xl font-bold">0s</p>
    </div>
  </div>

  <!-- Pass rate trend chart -->
  <div id="chart" class="bg-white p-4 shadow rounded-lg mb-8"></div>

  <!-- Section cards -->
  <h2 class="text-xl font-bold mb-4">Sections</h2>
  <div id="sectionCards" class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8"></div>

  <!-- Problem sections & features -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="bg-white shadow rounded-lg p-4">
      <h2 class="text-xl font-bold mb-4">Top 5 Sections with More Problems</h2>
      <ul id="topSections" class="list-none"></ul>
    </div>
    <div class="bg-white shadow rounded-lg p-4">
      <h2 class="text-xl font-bold mb-4">Top 5 Features with More Problems</h2>
      <ul id="topFeatures" class="list-none"></ul>
    </div>
  </div>
</div>

<script>
function formatName(str) {
  return str
    .replace(/-/g, ' ')
    .replace(/\.spec\.ts$/, '')
    .replace(/\b\w/g, c => c.toUpperCase());
}

async function loadReport() {
  const res = await fetch('./test-results.json');
  const data = await res.json();

  let passed = 0, failed = 0;
  const sectionStats = {};
  const featureStats = {};

  // Execution info
  document.getElementById("duration").innerText = (data.stats.duration / 1000).toFixed(1) + "s";
  document.getElementById("date").innerText = new Date(data.stats.startTime).toLocaleString();

  // Parse sections and features
  data.suites.forEach(suite => {
    const filePath = suite.file.replace(/\\/g, '/');
    const pathParts = filePath.split('/');
    const sectionName = formatName(pathParts[1] || 'Unknown');

    if (!sectionStats[sectionName]) {
      sectionStats[sectionName] = { passed: 0, failed: 0, features: {} };
    }

    suite.specs?.forEach(spec => {
      const specFile = spec.file.replace(/\\/g, '/');
      const specParts = specFile.split('/');
      const featureName = formatName(specParts[specParts.length - 1]);

      if (!sectionStats[sectionName].features[featureName]) {
        sectionStats[sectionName].features[featureName] = { passed: 0, failed: 0 };
      }

      spec.tests.forEach(test => {
        const status = test.results[0].status;
        if (status === "passed") {
          passed++;
          sectionStats[sectionName].passed++;
          sectionStats[sectionName].features[featureName].passed++;
        } else if (status === "failed" || status === "unexpected") {
          failed++;
          sectionStats[sectionName].failed++;
          sectionStats[sectionName].features[featureName].failed++;
        }
      });
    });
  });

  // Update global stats
  const totalTests = passed + failed;
  document.getElementById("passedCount").innerText = passed;
  document.getElementById("failedCount").innerText = failed;
  document.getElementById("passRate").innerText = ((passed / totalTests) * 100).toFixed(1) + "%";

  // Render section cards with expandable features
  const sectionCardsContainer = document.getElementById("sectionCards");
  sectionCardsContainer.innerHTML = '';
  for (const [section, stats] of Object.entries(sectionStats)) {
    const passRate = (stats.passed / (stats.passed + stats.failed) * 100).toFixed(1);
    let borderColor = 'border-green-500';
    if (passRate < 50) borderColor = 'border-red-500';
    else if (passRate < 80) borderColor = 'border-yellow-500';

    let featureTable = '<table class="w-full mt-2 hidden"><thead><tr class="bg-gray-100"><th class="p-1">Feature</th><th>Passed</th><th>Failed</th><th>Pass Rate</th></tr></thead><tbody>';
    for (const [feat, fstats] of Object.entries(stats.features)) {
      const fTotal = fstats.passed + fstats.failed;
      const fRate = (fstats.passed / fTotal * 100 || 0).toFixed(1);
      featureTable += `<tr><td class="p-1">${feat}</td><td>${fstats.passed}</td><td>${fstats.failed}</td><td>${fRate}%</td></tr>`;
      featureStats[feat] = { failed: fstats.failed, passRate: parseFloat(fRate) };
    }
    featureTable += '</tbody></table>';

    const card = document.createElement('div');
    card.className = `border-2 rounded-lg p-4 cursor-pointer ${borderColor}`;
    card.innerHTML = `<h3 class="text-lg font-bold">${section} tests</h3>
      <p>Passed: ${stats.passed}</p>
      <p>Failed: ${stats.failed}</p>
      <p class="font-bold">Pass rate: ${passRate}%</p>
      ${featureTable}`;
    card.addEventListener('click', () => {
      const table = card.querySelector('table');
      table.classList.toggle('hidden');
    });
    sectionCardsContainer.appendChild(card);
  }

  // Top 5 sections with problems
  const sortedSections = Object.entries(sectionStats)
    .map(([name, s]) => ({ name, passRate: (s.passed / (s.passed + s.failed) * 100) || 0 }))
    .sort((a, b) => a.passRate - b.passRate)
    .slice(0, 5);
  const topSectionsList = document.getElementById("topSections");
  sortedSections.forEach(sec => {
    topSectionsList.innerHTML += `<li class="flex justify-between"><span>${sec.name}</span><span>${sec.passRate.toFixed(1)}%</span></li>`;
  });

  // Top 5 features with problems
  const sortedFeatures = Object.entries(featureStats)
    .sort((a, b) => a[1].passRate - b[1].passRate)
    .slice(0, 5);
  const topFeaturesList = document.getElementById("topFeatures");
  sortedFeatures.forEach(([name, stats]) => {
    topFeaturesList.innerHTML += `<li class="flex justify-between"><span>${name}</span><span>${stats.passRate.toFixed(1)}%</span></li>`;
  });

  // Pass rate trend chart (placeholder)
  const chartOptions = {
    chart: { type: 'line', height: 300 },
    series: [{
      name: 'Overall Pass Rate',
      data: [65, 70, 72, 76] // Replace with real history.json data
    }],
    xaxis: { categories: ['Run 1', 'Run 2', 'Run 3', 'Run 4'] },
    colors: ['#16a34a']
  };
  new ApexCharts(document.querySelector("#chart"), chartOptions).render();
}

loadReport();
</script>
</body>
</html>
