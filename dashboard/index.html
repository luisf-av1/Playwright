<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>App Stability Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body class="bg-gray-50 text-gray-900">
<div class="max-w-7xl mx-auto p-6">
  <h1 class="text-3xl font-bold mb-2">App Stability Dashboard</h1>
  <p class="mb-6">App stability based on test executions</p>

  <!-- Summary Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-5 gap-4 mb-8">
    <div class="bg-white shadow rounded-lg p-4 text-center">
      <p class="text-gray-500">Passed</p>
      <p id="passedCount" class="text-2xl font-bold">0</p>
    </div>
    <div class="bg-white shadow rounded-lg p-4 text-center">
      <p class="text-gray-500">Failed</p>
      <p id="failedCount" class="text-2xl font-bold text-red-500">0</p>
    </div>
    <div class="bg-white shadow rounded-lg p-4 text-center">
      <p class="text-gray-500">Overall Pass Rate</p>
      <p id="passRate" class="text-2xl font-bold">0%</p>
    </div>
    <div class="bg-white shadow rounded-lg p-4 text-center">
      <p class="text-gray-500">Last Execution Date</p>
      <p id="date" class="text-sm font-bold">-</p>
    </div>
    <div class="bg-white shadow rounded-lg p-4 text-center">
      <p class="text-gray-500">Execution Duration</p>
      <p id="duration" class="text-2xl font-bold">0s</p>
    </div>
  </div>

  <!-- Pass rate trend chart -->
  <div id="chart" class="bg-white p-4 shadow rounded-lg mb-8"></div>

  <!-- Section cards -->
  <div id="sectionCards" class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8"></div>

  <!-- Problem features -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="bg-white shadow rounded-lg p-4">
      <h2 class="text-xl font-bold mb-4">Top 5 Features with More Problems</h2>
      <ul id="topFeatures" class="list-none"></ul>
    </div>
  </div>
</div>

<script>
async function loadReport() {
  const res = await fetch('./test-results.json');
  const data = await res.json();

  let passed = 0, failed = 0;
  const sectionStats = {};
  const featureFails = {};

  // Extract execution date & duration
  document.getElementById("duration").innerText = (data.stats.duration / 1000).toFixed(1) + "s";
  document.getElementById("date").innerText = new Date(data.stats.startTime).toLocaleString();

  // Process sections & features
  data.suites.forEach(sectionSuite => {
    const sectionName = sectionSuite.title.split("\\").pop().replace(/-/g, ' ').replace(/\.spec\.ts$/, '').replace(/\b\w/g, c => c.toUpperCase());
    let secPassed = 0, secFailed = 0;

    sectionSuite.suites?.forEach(featureSuite => {
      let featFails = 0;

      featureSuite.specs?.forEach(spec => {
        spec.tests.forEach(test => {
          const status = test.results[0].status;
          if (status === "passed") { passed++; secPassed++; }
          else { failed++; secFailed++; featFails++; }
        });
      });

      if (!featureFails[featureSuite.title]) featureFails[featureSuite.title] = 0;
      featureFails[featureSuite.title] += featFails;
    });

    const total = secPassed + secFailed;
    sectionStats[sectionName] = {
      passed: secPassed,
      failed: secFailed,
      passRate: total ? (secPassed / total) * 100 : 0
    };
  });

  // Update global stats
  const totalTests = passed + failed;
  document.getElementById("passedCount").innerText = passed;
  document.getElementById("failedCount").innerText = failed;
  document.getElementById("passRate").innerText = ((passed / totalTests) * 100).toFixed(1) + "%";

  // Render section cards
  const sectionCardsContainer = document.getElementById("sectionCards");
  sectionCardsContainer.innerHTML = '';
  for (const [name, stats] of Object.entries(sectionStats)) {
    let color = 'green';
    if (stats.passRate < 50) color = 'red';
    else if (stats.passRate < 80) color = 'yellow';

    const card = `
      <div class="border-2 rounded-lg p-4 ${color === 'green' ? 'border-green-500' : color === 'yellow' ? 'border-yellow-500' : 'border-red-500'}">
        <h3 class="text-lg font-bold mb-2">${name} tests</h3>
        <p>Passed: ${stats.passed}</p>
        <p>Failed: ${stats.failed}</p>
        <p class="font-bold">Pass rate: ${stats.passRate.toFixed(1)}%</p>
      </div>
    `;
    sectionCardsContainer.innerHTML += card;
  }

  // Render top 5 problem features
  const sortedFeatures = Object.entries(featureFails).sort((a,b) => b[1] - a[1]).slice(0,5);
  const featureList = document.getElementById("topFeatures");
  sortedFeatures.forEach(([feature, fails]) => {
    featureList.innerHTML += `<li class="flex justify-between"><span>${feature}</span><span>Fails: ${fails}</span></li>`;
  });

  // Render pass rate trend chart (dummy data here, needs historical JSON to be real)
  const chartOptions = {
    chart: { type: 'line', height: 300 },
    series: [{
      name: 'Overall Pass Rate',
      data: [65, 70, 72, 76] // TODO: replace with historical data
    }],
    xaxis: {
      categories: ['Run 1', 'Run 2', 'Run 3', 'Run 4']
    },
    colors: ['#16a34a']
  };
  new ApexCharts(document.querySelector("#chart"), chartOptions).render();
}

loadReport();
</script>
</body>
</html>
