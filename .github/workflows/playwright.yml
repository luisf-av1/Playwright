name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.set_run_id.outputs.run_id }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test --reporter=json,json-summary

    - name: Save Run ID
      id: set_run_id
      run: echo "run_id=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

    - name: Upload test report
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: |
          playwright-report/
          test-results/
          test-results.json
          test-results-summary.json

  generate-report:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: test-report

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm install fs-extra

    - name: Generate historical entry
      run: |
        mkdir -p pages/data/history
        node .github/scripts/aggregate-report.js "${{ needs.test.outputs.run_id }}"

    - name: Commit historical JSON data
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git pull
        git add pages/data/history/
        git commit -m "Add test results for run ${{ needs.test.outputs.run_id }}" || echo "No changes to commit"
        git push

  deploy-pages:
    needs: generate-report
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./pages

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
