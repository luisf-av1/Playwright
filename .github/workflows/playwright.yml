name: Tests Dashboard

on:
  workflow_dispatch:
  push:
    branches: [ "staging", "main" ]
  pull_request:
    branches: [ "staging", "main" ]
  schedule:
  - cron: "0 9 * * 1-5"

jobs:
  test-execution:
    runs-on: ubuntu-latest
    steps:
      
      - name: ⬇️ Checkout code # Downloads the repo into the runner.
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📦 Install Playwright Browsers
        run: npx playwright install --with-deps
        
      - name: Run Playwright tests
        run: npx playwright test --reporter=json --output=playwright-report
        continue-on-error: true

      - name: Copy JSON report to dashboard folder
        run: cp playwright-report/test-results.json dashboard/test-results.json

      - name: 📊 Upload test report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: playwright-report/

      - name: 🌐 Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: ./dashboard
          publish_branch: gh-pages
