name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.set_run_id.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Save Run ID
        id: set_run_id
        run: echo "run_id=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Run Playwright tests
        id: run_tests
        run: |
          mkdir -p playwright-report
          npx playwright test --reporter=json --output=playwright-report
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload test report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: playwright-report/

  generate-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Download test report artifact
        uses: actions/download-artifact@v4
        with:
          name: test-report
          path: playwright-report/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Generate historical summary JSON
        run: |
          mkdir -p pages/data/history
          node .github/scripts/aggregate-report.js ${{ needs.test.outputs.run_id }}

      - name: Commit test summary JSON
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pages/data/history/
          git commit -m "Add test run summary: ${{ needs.test.outputs.run_id }}" || echo "No changes to commit"
          git push

  deploy-pages:
    needs: generate-report
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
